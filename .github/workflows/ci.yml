name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # npm ci runs dependency install scripts; nothing here pushes, so
          # don't leave the token in .git/config for them to read.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # release.yml publishes every version merged to main with these notes
      - name: Release notes for this version
        run: .github/release-notes/check.sh
      - run: npm ci
      - run: npm run build
      - run: npm test
